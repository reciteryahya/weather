<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get real-time weather updates with Yahya's Weather App. Accurate, fast, and simple. Share weather details on social platforms!">
    <meta name="keywords" content="Weather, Yahya, Real-time weather, Share Weather, Forecast, Social Media">
    <meta name="author" content="Yahya">
    <title>Weather by Yahya</title>
    <link rel="icon" type="image/jpeg" href="weather.jpeg" sizes="32x32">
    <link rel="canonical" href="https://yourwebsite.com/" />
    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="Weather by Yahya">
    <meta property="og:description" content="Get real-time weather updates with Yahya's Weather App.">
    <meta property="og:image" content="https://yourwebsite.com/weather.jpeg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0b1020">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="display-4 weather-banner">WEATHER BY YAHYA</h1>
    </header>

    <video class="vh-100 yahya1" autoplay muted loop playsinline poster="weather.jpeg">
        <source src="857021-hd_1920_1080_30fps.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <main class="overlay">
        <div class="center-card">
            <div class="card-content">
                <h2 class="card-title">Real-time Weather</h2>

                <form id="searchForm" class="input-group-wrapper" onsubmit="event.preventDefault(); weather();">
                    <label for="cityInput" class="visually-hidden">City name</label>
                    <div class="flag-input">
                        <span class="city-flag" title="City flag" aria-hidden="true">🏳️</span>
                        <input id="cityInput" name="city" type="search" class="form-control rounded city flag-aware" placeholder="Search for a city (e.g. London)" aria-label="City name" />
                    </div>
                    <button type="submit" class="btn btn-primary search-btn" aria-label="Search">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242 0a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
                        </svg>
                        <span class="btn-text">Search</span>
                    </button>
                </form>

                <h3 class="result" aria-live="polite"></h3>

                <div class="share-buttons" role="group" aria-label="Share weather">
                    <button class="btn btn-success" onclick="shareOnWhatsApp()" aria-label="Share on WhatsApp">WhatsApp</button>
                    <button class="btn btn-primary" onclick="shareOnTwitter()" aria-label="Share on Twitter">Twitter</button>
                    <button class="btn btn-info" onclick="shareOnLinkedIn()" aria-label="Share on LinkedIn">LinkedIn</button>
                </div>

                <p class="tagline">Simple, accurate, Yahya's weather.</p>
                <footer class="card-footer">CREATED BY <cite title="Source Title">YAHYA</cite></footer>
            </div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="footer-inner">Built with ❤️ — Data by OpenWeather</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
    <script>
        function shareOnWhatsApp() {
            const city = document.querySelector(".city").value || "the city";
            const message = `Check out the current weather for ${city} on Weather by Yahya!`;
            const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function shareOnTwitter() {
            const city = document.querySelector(".city").value || "the city";
            const message = `Current weather for ${city}! Accurate updates by Weather by Yahya.`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function shareOnLinkedIn() {
            const city = document.querySelector(".city").value || "the city";
            const message = `Discover the current weather for ${city} with Weather by Yahya. Accurate and real-time updates!`;
            const shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent('https://yourwebsite.com')}`;
            window.open(shareUrl, '_blank');
        }
    </script>
</body>
</html>
