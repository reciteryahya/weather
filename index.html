<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get real-time weather updates with Yahya's Weather App. Accurate, fast, and beautifully designed.">
    <meta name="keywords" content="Weather, Yahya, Real-time weather, Forecast">
    <meta name="author" content="Yahya">
    <title>Weather by Yahya</title>
    <link rel="icon" type="image/png" href="weather.jpeg" sizes="32x32">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Video -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="857021-hd_1920_1080_30fps.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <!-- Main App -->
    <div class="app-wrapper">

        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🌤</span>
                <span class="logo-text">WEATHER <span class="logo-by">by</span> YAHYA</span>
            </div>
        </header>

        <!-- Hero Section -->
        <main class="hero">
            <div class="hero-content">
                <h1 class="hero-title">
                    <span class="line1">What's the</span>
                    <span class="line2">Weather Like?</span>
                </h1>
                <p class="hero-subtitle">Real-time forecasts for any city on Earth.</p>

                <!-- Search Box -->
                <div class="search-box">
                    <input
                        type="text"
                        class="city-input"
                        id="cityInput"
                        placeholder="Enter city name..."
                        autocomplete="off"
                        aria-label="City name"
                    />
                    <button class="search-btn" onclick="getWeather()" aria-label="Search weather">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </button>
                </div>

                <!-- Error Message -->
                <div class="error-box" id="errorBox" style="display:none;">
                    <span id="errorText"></span>
                </div>
            </div>
        </main>

        <!-- Weather Result Card -->
        <section class="weather-card" id="weatherCard" style="display:none;">
            <div class="card-inner">
                <div class="card-top">
                    <div class="card-location">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        <span id="cityDisplay"></span>, <span id="countryDisplay"></span>
                    </div>
                    <div class="card-date" id="dateDisplay"></div>
                </div>

                <div class="card-main">
                    <div class="card-icon" id="weatherIcon"></div>
                    <div class="card-temp" id="tempDisplay"></div>
                    <div class="card-desc" id="descDisplay"></div>
                </div>

                <div class="card-stats">
                    <div class="stat">
                        <div class="stat-icon">💧</div>
                        <div class="stat-value" id="humidityDisplay"></div>
                        <div class="stat-label">Humidity</div>
                    </div>
                    <div class="stat">
                        <div class="stat-icon">🌡️</div>
                        <div class="stat-value" id="feelsLikeDisplay"></div>
                        <div class="stat-label">Feels Like</div>
                    </div>
                    <div class="stat">
                        <div class="stat-icon">💨</div>
                        <div class="stat-value" id="windDisplay"></div>
                        <div class="stat-label">Wind</div>
                    </div>
                    <div class="stat">
                        <div class="stat-icon">📊</div>
                        <div class="stat-value" id="pressureDisplay"></div>
                        <div class="stat-label">Pressure</div>
                    </div>
                </div>

                <!-- Share Buttons -->
                <div class="share-section">
                    <p class="share-label">Share this weather</p>
                    <div class="share-buttons">
                        <button class="share-btn whatsapp" onclick="shareOnWhatsApp()">
                            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                            WhatsApp
                        </button>
                        <button class="share-btn twitter" onclick="shareOnTwitter()">
                            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.259 5.631 5.905-5.631zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                            Twitter / X
                        </button>
                        <button class="share-btn linkedin" onclick="shareOnLinkedIn()">
                            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                            LinkedIn
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Loading Spinner -->
        <div class="loading-spinner" id="loadingSpinner" style="display:none;">
            <div class="spinner"></div>
            <p>Fetching weather...</p>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Simple, accurate — Yahya's Weather &nbsp;·&nbsp; <span id="year"></span></p>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
